name: UX V3 diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  component-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Client CRM
        run: pnpm --filter web exec vitest run src/components/__tests__/ClientCRM.test.tsx
      - name: Entitlement UI
        run: pnpm --filter web exec vitest run src/components/__tests__/EntitlementUI.test.tsx
      - name: Public booking
        run: pnpm --filter web exec vitest run src/components/__tests__/PublicBooking.test.tsx
      - name: Public form completion
        run: pnpm --filter web exec vitest run src/components/__tests__/PublicFormCompletion.test.tsx
      - name: Mobile navigation
        run: pnpm --filter web exec vitest run src/components/navigation/MobileNavigation.test.tsx
