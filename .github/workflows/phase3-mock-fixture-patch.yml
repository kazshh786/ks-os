name: Phase 3 mock fixture patch

on:
  push:
    branches:
      - feature/email-phase-3-template-completeness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/email-phase-3-template-completeness
          fetch-depth: 0
      - name: Complete communications mock fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/data/mock-data-provider.ts')
          text = path.read_text()

          timing = "      formReminderTiming: '24_hours_after_assignment',\n      branding:"
          replacement = "      formReminderTiming: '24_hours_after_assignment',\n      mainBookingFormId: null,\n      branding:"
          if timing not in text:
              raise SystemExit('form reminder timing marker not found')
          text = text.replace(timing, replacement, 1)

          marker = "        customerBookingConfirmation: { subject: 'Your booking with {{businessName}} is confirmed', heading: 'Booking confirmed', body: 'Hi {{customerName}}, your {{serviceName}} booking is confirmed. We look forward to seeing you.' },\n"
          additions = """        customerBookingCancellation: { subject: 'Your booking with {{businessName}} has been cancelled', heading: 'Booking cancelled', body: 'Hi {{customerName}}, your {{serviceName}} booking has been cancelled.' },
        customerBookingReschedule: { subject: 'Your booking with {{businessName}} has been rescheduled', heading: 'Your booking has a new time', body: 'Hi {{customerName}}, your {{serviceName}} booking has been rescheduled.' },
        customerPaymentConfirmation: { subject: 'Payment confirmed with {{businessName}}', heading: 'Payment confirmed', body: 'Hi {{customerName}}, we received {{amount}} {{currency}}.' },
        customerRefundUpdate: { subject: 'Refund update from {{businessName}}', heading: 'Your refund has been updated', body: 'Hi {{customerName}}, your refund status is {{status}}.' },
        formAssignment: { subject: 'Please complete your {{formName}} form', heading: 'A form is ready for you', body: 'Hi {{customerName}}, please complete {{formName}}.' },
        formReminder: { subject: 'Reminder: please complete {{formName}}', heading: 'Your form is still waiting', body: 'Hi {{customerName}}, please complete {{formName}} before your appointment.' },
        customerPortalAccess: { subject: 'Your secure access to {{businessName}}', heading: 'Your customer access link', body: 'Hi {{customerName}}, view your appointments, forms and payment updates.' },
"""
          if marker not in text:
              raise SystemExit('booking confirmation template marker not found')
          text = text.replace(marker, marker + additions, 1)
          path.write_text(text)
          PY
          rm .github/workflows/phase3-mock-fixture-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/data/mock-data-provider.ts .github/workflows/phase3-mock-fixture-patch.yml
          git commit -m "test(email): complete mock communications settings"
          git push origin HEAD:feature/email-phase-3-template-completeness
