name: Agency controls validation
on:
  pull_request:
    paths:
      - 'apps/api/src/lib/supabase-admin.ts'
      - 'apps/api/src/modules/agency/**'
      - 'apps/api/tests/manual-tenant-user-contract.test.ts'
      - 'apps/web/src/api/client.ts'
      - 'apps/web/src/features/agency/**'
      - 'apps/web/src/layouts/AgencyLayout.tsx'
      - '.github/workflows/agency-controls-validation.yml'
permissions:
  contents: read
concurrency:
  group: agency-controls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { show-progress: false }
      - uses: pnpm/action-setup@v4
        with: { version: 11.13.1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --reporter=silent
      - run: pnpm --filter api... build
      - run: pnpm --filter api typecheck
      - run: pnpm --filter api exec node --import tsx --test tests/manual-tenant-user-contract.test.ts
      - run: pnpm --filter web... build
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web exec vitest run src/features/agency/__tests__/AgencyAuth.test.ts
