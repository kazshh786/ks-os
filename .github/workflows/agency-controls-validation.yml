name: Agency controls validation
on:
  pull_request:
    paths:
      - 'apps/api/src/lib/supabase-admin.ts'
      - 'apps/api/src/modules/agency/**'
      - 'apps/web/src/api/client.ts'
      - 'apps/web/src/features/agency/**'
      - 'apps/web/src/layouts/AgencyLayout.tsx'
      - '.github/workflows/agency-controls-validation.yml'
permissions:
  contents: read
concurrency:
  group: agency-controls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { show-progress: false }
      - uses: pnpm/action-setup@v4
        with: { version: 11.13.1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --reporter=silent
      - name: Capture API build
        run: |
          set +e
          pnpm --filter api build > api-build.log 2>&1
          echo "$?" > api-build.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: agency-api-build
          path: |
            api-build.log
            api-build.exit
      - name: Assert API build
        run: test "$(cat api-build.exit)" = "0"
      - run: pnpm --filter api typecheck
      - run: pnpm --filter web build
      - run: pnpm --filter web typecheck
