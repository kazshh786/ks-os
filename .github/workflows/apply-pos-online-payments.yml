# Temporary repair workflow: generate and commit the POS online-payment integration.
name: Apply POS online payments

on:
  push:
    branches: [feature/pos-online-payments]

permissions:
  contents: write

concurrency:
  group: apply-pos-online-payments-source
  cancel-in-progress: true

jobs:
  apply-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install current workspace
        run: pnpm install --frozen-lockfile
      - name: Apply API and UI integration
        run: |
          python .github/scripts/fix-pos-online-ui-script.py
          python .github/scripts/apply-pos-online-api.py
          python .github/scripts/apply-pos-online-ui.py
      - name: Add Stripe web checkout dependencies
        run: |
          pnpm --filter web add --save-exact @stripe/react-stripe-js@6.8.0 @stripe/stripe-js@9.12.0 qrcode@1.5.4
          pnpm --filter web add --save-exact --save-dev @types/qrcode@1.5.6
      - name: Remove temporary generators
        run: |
          rm .github/scripts/apply-pos-online-api.py
          rm .github/scripts/apply-pos-online-ui.py
          rm .github/scripts/fix-pos-online-ui-script.py
          rm .github/workflows/apply-pos-online-payments.yml
      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: connect online payments to POS"
          git push origin HEAD:feature/pos-online-payments
