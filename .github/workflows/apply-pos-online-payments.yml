name: Apply POS online payments

on:
  push:
    branches: [feature/pos-online-payments]

permissions:
  contents: write

concurrency:
  group: apply-pos-online-payments
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres_ci
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: ks_os_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres_ci:postgres_ci_password@127.0.0.1:5432/ks_os_ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install current workspace
        run: pnpm install --frozen-lockfile
      - name: Apply API and UI patches
        run: |
          python .github/scripts/apply-pos-online-api.py
          python .github/scripts/apply-pos-online-ui.py
      - name: Add Stripe web checkout dependencies
        run: |
          pnpm --filter web add --save-exact @stripe/react-stripe-js@6.8.0 @stripe/stripe-js@9.12.0 qrcode@1.5.4
          pnpm --filter web add --save-exact --save-dev @types/qrcode@1.5.6
      - name: Install browser test dependency
        run: pnpm --filter site-worker exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Validate migration plan
        run: pnpm db:migrations:plan
      - name: Remove temporary patch workflow
        run: |
          rm .github/scripts/apply-pos-online-api.py
          rm .github/scripts/apply-pos-online-ui.py
          rm .github/workflows/apply-pos-online-payments.yml
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add online payments to POS"
          git push origin HEAD:feature/pos-online-payments
