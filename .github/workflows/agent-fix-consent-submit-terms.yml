name: Apply consent form fix

on:
  push:
    branches:
      - agent/fix-consent-submit-terms
    paths:
      - .agent-patches/**
      - .github/workflows/agent-fix-consent-submit-terms.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply generated files
        shell: python
        run: |
          import base64
          import gzip
          import shutil
          from pathlib import Path

          files = {
              '.agent-patches/PublicWorkspaceFormPage.tsx.gz.b64': 'apps/web/src/pages/PublicWorkspaceFormPage.tsx',
              '.agent-patches/FormRenderer.tsx.gz.b64': 'apps/web/src/features/forms/FormRenderer.tsx',
              '.agent-patches/forms.ts.gz.b64': 'packages/contracts/src/forms.ts',
              '.agent-patches/NotFoundPage.tsx.gz.b64': 'apps/web/src/pages/NotFoundPage.tsx',
          }
          for payload, target in files.items():
              compressed = base64.b64decode(Path(payload).read_text().strip())
              Path(target).write_bytes(gzip.decompress(compressed))
          shutil.rmtree('.agent-patches')
          Path('.github/workflows/agent-fix-consent-submit-terms.yml').unlink()

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix consent submission and legal terms pages"
          git push origin "HEAD:${GITHUB_REF_NAME}"
