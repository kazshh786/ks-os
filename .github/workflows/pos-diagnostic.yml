name: POS diagnostic
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/contracts/**'
      - '.github/workflows/pos-diagnostic.yml'
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: pos-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.13.1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --silent
      - name: Build workspace and publish concise diagnostics
        shell: bash
        run: |
          set +e
          pnpm build > /tmp/pos-workspace-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo '<!-- pos-workspace-build-diagnostic -->'
              echo '### POS workspace build diagnostic'
              echo '```text'
              tail -n 160 /tmp/pos-workspace-build.log
              echo '```'
            } > /tmp/pos-workspace-comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/pos-workspace-comment.md
          fi
          cat /tmp/pos-workspace-build.log
          exit $status
