name: CI
on:
  pull_request:
  push:
    branches: [main, staging]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  copy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Audit UX copy
        run: |
          set -e
          mkdir source
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${SOURCE_SHA}" \
            --output source.tar.gz
          tar -xzf source.tar.gz --strip-components=1 -C source
          cd source
          node scripts/quality/copy-audit.mjs

  api-test-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Run API tests quietly
        run: |
          set -e
          mkdir source
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${SOURCE_SHA}" \
            --output source.tar.gz
          tar -xzf source.tar.gz --strip-components=1 -C source
          cd source
          corepack enable
          corepack prepare pnpm@11.13.1 --activate >/dev/null 2>&1
          pnpm install --frozen-lockfile --reporter=silent >/dev/null
          if ! pnpm --filter api test >api-tests.log 2>&1; then
            grep -n -E "not ok|AssertionError|ERR_ASSERTION|failureType|error:" api-tests.log | tail -n 120 || true
            exit 1
          fi
          tail -n 20 api-tests.log

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres_ci
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: ks_os_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres_ci:postgres_ci_password@127.0.0.1:5432/ks_os_ci
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.13.1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter site-worker exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrations:plan
