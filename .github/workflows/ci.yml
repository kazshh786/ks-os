name: CI
on:
  pull_request:
  push:
    branches: [main, staging]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  copy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Audit UX copy
        run: |
          set -e
          mkdir source
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${SOURCE_SHA}" \
            --output source.tar.gz
          tar -xzf source.tar.gz --strip-components=1 -C source
          cd source
          node scripts/quality/copy-audit.mjs

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres_ci
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: ks_os_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres_ci:postgres_ci_password@127.0.0.1:5432/ks_os_ci
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.13.1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter site-worker exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          BOOKING_INTEGRITY_TEST_DATABASE_URL: postgresql://postgres_ci:postgres_ci_password@127.0.0.1:5432/ks_os_ci
      - run: pnpm db:migrations:plan

  communications:
    name: Communications browser verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://isolated_test:isolated_test@127.0.0.1:5432/isolated_test
      COMMUNICATIONS_BROWSER_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter site-worker exec playwright install --with-deps chromium
      - run: pnpm --filter @ks-os/contracts --filter @ks-os/database build
      - name: Exercise the real communications database, HTTP and browser flows
        working-directory: apps/api
        run: node --import ./tests/test-environment.mjs --import tsx --test tests/communications-foundation.test.ts
      - name: Upload communications browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: communications-browser
          path: artifacts/communications
          if-no-files-found: ignore

  phase4-lockfile:
    name: Prepare patched image dependency
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/communications-phase-4' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with: { version: 11.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Resolve patched sharp for API without running package scripts
        run: pnpm --filter api add sharp@0.35.5 --save-exact --lockfile-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: phase4-patched-lockfile
          path: |
            pnpm-lock.yaml
            apps/api/package.json
