name: Agency panel test diagnostic
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/agency-panel-test-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { show-progress: false }
      - uses: pnpm/action-setup@v4
        with: { version: 11.13.1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --reporter=silent
      - run: pnpm --filter web... build
      - name: Capture web tests
        run: |
          set +e
          pnpm --filter web test > web-test.log 2>&1
          echo "$?" > web-test.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: agency-panel-web-tests
          path: |
            web-test.log
            web-test.exit
      - name: Assert web tests
        run: test "$(cat web-test.exit)" = "0"
