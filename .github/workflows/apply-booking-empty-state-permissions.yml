name: Apply booking empty-state permission copy fix

on:
  push:
    branches:
      - agent/booking-empty-state-date

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/booking-empty-state-date
          fetch-depth: 0

      - name: Apply guarded source edits
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/src/features/bookings/PublicBookingFlow.tsx")
          source = path.read_text()

          replacements = [
              (
                  "  const canTryNextDate = nextDate <= dateMaximum;\n  const enabledChannels: BookingChannel[] =",
                  "  const canTryNextDate = nextDate <= dateMaximum;\n  const canChooseAnyStaff = staffId !== 'any' && page?.bookingRules.allowAnyStaff !== false;\n  const enabledChannels: BookingChannel[] =",
              ),
              (
                  "{staffId === 'any' ? 'Try the next date or choose another day.' : 'Try the next date, or check availability across the whole team.'}",
                  "{canChooseAnyStaff ? 'Try the next date, or check availability across the whole team.' : 'Try the next date or choose another day.'}",
              ),
              (
                  "{staffId !== 'any' && page?.bookingRules.allowAnyStaff !== false && <button",
                  "{canChooseAnyStaff && <button",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one guarded match, found {count}: {old[:100]!r}")
              source = source.replace(old, new, 1)

          path.write_text(source)

      - name: Commit component change
        run: |
          rm .github/workflows/apply-booking-empty-state-permissions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/bookings/PublicBookingFlow.tsx .github/workflows/apply-booking-empty-state-permissions.yml
          git diff --cached --check
          git commit -m "Refine booking recovery copy by staff rules"
          git push origin HEAD:agent/booking-empty-state-date
