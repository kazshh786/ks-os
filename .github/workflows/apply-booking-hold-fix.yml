name: Apply booking hold fix

on:
  push:
    branches:
      - fix/public-booking-hold-reservation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-booking-hold-reservation
          fetch-depth: 0

      - name: Apply focused booking hold fix
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          service_path = Path('apps/api/src/modules/bookings/booking-page.service.ts')
          service = service_path.read_text()
          old_date = "      const localDate = new Intl.DateTimeFormat('en-CA', { timeZone: tenant.timezone, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(input.startTime));"
          new_date = """      const localDateParts = new Intl.DateTimeFormat('en-GB', {
                timeZone: tenant.timezone,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
              }).formatToParts(new Date(input.startTime));
              const year = localDateParts.find(part => part.type === 'year')?.value;
              const month = localDateParts.find(part => part.type === 'month')?.value;
              const day = localDateParts.find(part => part.type === 'day')?.value;
              if (!year || !month || !day) {
                throw Object.assign(new Error('The selected appointment date could not be read.'), { code: 'INVALID_HOLD_REQUEST', statusCode: 400 });
              }
              const localDate = `${year}-${month}-${day}`;"""
          if old_date not in service:
              raise SystemExit('Expected locale-dependent hold date line was not found')
          service = service.replace(old_date, new_date, 1)
          old_slot = "      const slot = availability.slots.find(item => item.staffId === input.staffId && item.start === input.startTime);"
          new_slot = """      const requestedStart = new Date(input.startTime).getTime();
              const slot = availability.slots.find(item => item.staffId === input.staffId && new Date(item.start).getTime() === requestedStart);"""
          if old_slot not in service:
              raise SystemExit('Expected hold slot comparison was not found')
          service_path.write_text(service.replace(old_slot, new_slot, 1))

          flow_path = Path('apps/web/src/features/bookings/PublicBookingFlow.tsx')
          flow = flow_path.read_text()
          old_catch = "    } catch { setError('That time was just reserved by someone else. Choose another available time.'); setSlots(current => current.filter(item => item.start !== nextSlot.start || item.staffId !== nextSlot.staffId)); }"
          new_catch = """    } catch (cause) {
                const code = cause instanceof Error ? cause.message : '';
                if (code === 'SLOT_UNAVAILABLE' || code === 'SLOT_HELD') {
                  setError('That time was just reserved by someone else. Choose another available time.');
                  setSlots(current => current.filter(item => item.start !== nextSlot.start || item.staffId !== nextSlot.staffId));
                } else {
                  setError('We could not reserve this time right now. Refresh availability and try again.');
                }
              }"""
          if old_catch not in flow:
              raise SystemExit('Expected slot error handler was not found')
          flow_path.write_text(flow.replace(old_catch, new_catch, 1))

          test_path = Path('apps/api/tests/client-booking-usability.test.ts')
          tests = test_path.read_text()
          ui_anchor = "  assert.match(source, /aria-live=\"polite\"/);\n"
          ui_addition = "  assert.match(source, /cause instanceof Error/);\n  assert.match(source, /code === 'SLOT_UNAVAILABLE' \\|\\| code === 'SLOT_HELD'/);\n  assert.match(source, /We could not reserve this time right now\\. Refresh availability and try again\\./);\n"
          if ui_addition not in tests:
              if ui_anchor not in tests:
                  raise SystemExit('Customer booking UI assertion anchor was not found')
              tests = tests.replace(ui_anchor, ui_anchor + ui_addition, 1)

          hold_test = """

          test('booking holds derive the business-local date without locale-dependent text', () => {
            const source = fs.readFileSync(path.resolve(process.cwd(), 'src/modules/bookings/booking-page.service.ts'), 'utf8');
            assert.match(source, /formatToParts\(new Date\(input\.startTime\)\)/);
            assert.match(source, /const localDate = `\$\{year\}-\$\{month\}-\$\{day\}`/);
            assert.match(source, /new Date\(item\.start\)\.getTime\(\) === requestedStart/);
            assert.doesNotMatch(source, /Intl\.DateTimeFormat\('en-CA'.*\.format\(new Date\(input\.startTime\)\)/s);
          });
          """
          if "booking holds derive the business-local date" not in tests:
              tests += hold_test
          test_path.write_text(tests)
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-booking-hold-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/bookings/booking-page.service.ts \
                  apps/web/src/features/bookings/PublicBookingFlow.tsx \
                  apps/api/tests/client-booking-usability.test.ts \
                  .github/workflows/apply-booking-hold-fix.yml
          git commit -m "Fix public booking slot reservations"
          git push origin HEAD:fix/public-booking-hold-reservation
