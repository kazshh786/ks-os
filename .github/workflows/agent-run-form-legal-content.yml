name: Run form legal content patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply the reviewed patch
        run: |
          awk '
            /^[[:space:]]*python - <<.PY.$/ { capture=1; next }
            capture && /^[[:space:]]*PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/agent-apply-form-legal-content.yml > /tmp/apply-form-legal-content.py
          python - <<'PY'
          from pathlib import Path
          script = Path('/tmp/apply-form-legal-content.py')
          text = script.read_text()
          marker = '"""  if (!acknowledgement.trim()) {'
          position = text.index(marker)
          start = text.rfind('replace_once(', 0, position)
          end = text.index('\n)\n', position) + 3
          script.write_text(text[:start] + text[end:])
          PY
          python /tmp/apply-form-legal-content.py
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/pages/FormEditorPage.tsx')
          text = path.read_text()
          old = """  if (!acknowledgement.trim()) {
            issues.push({ key: 'acknowledgement', message: 'Add the final acknowledgement customers sign before submitting.' });
          }
          """
          new = """  if (hasTermsAcceptance && !schema.settings.termsAndConditionsText?.trim()) {
            issues.push({ key: 'terms', message: 'Add the terms and conditions clients will read before accepting.' });
          }
          if (!acknowledgement.trim()) {
            issues.push({ key: 'acknowledgement', message: 'Add the final acknowledgement customers sign before submitting.' });
          }
          """
          if text.count(old) != 1:
              raise SystemExit(f'Expected acknowledgement validation once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit the product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/forms.ts \
            apps/web/src/pages/PublicWorkspaceFormPage.tsx \
            apps/web/src/pages/FormEditorPage.tsx \
            apps/web/src/pages/FormEditorPage.test.tsx
          git commit -m "feat: add dedicated form legal content fields [legal-content-applied]"
          git push origin HEAD:${{ github.head_ref }}
