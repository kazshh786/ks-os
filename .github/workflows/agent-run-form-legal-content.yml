name: Run form legal content patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply the reviewed patch
        run: |
          awk '
            /^[[:space:]]*python - <<.PY.$/ { capture=1; next }
            capture && /^[[:space:]]*PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/agent-apply-form-legal-content.yml > /tmp/apply-form-legal-content.py
          python - <<'PY'
          from pathlib import Path
          script = Path('/tmp/apply-form-legal-content.py')
          text = script.read_text()
          for marker in ('"""  if (!acknowledgement.trim()) {', '"""  settings: {'):
              position = text.index(marker)
              start = text.rfind('replace_once(', 0, position)
              end = text.index('\n)\n', position) + 3
              text = text[:start] + text[end:]
          script.write_text(text)
          PY
          python /tmp/apply-form-legal-content.py
          python - <<'PY'
          from pathlib import Path
          import re

          editor = Path('apps/web/src/pages/FormEditorPage.tsx')
          text = editor.read_text()
          pattern = re.compile(r"  if \(!acknowledgement\.trim\(\)\) \{\n\s+issues\.push\(\{ key: 'acknowledgement', message: 'Add the final acknowledgement customers sign before submitting\.' \}\);\n  \}\n")
          replacement = (
              "  if (hasTermsAcceptance && !schema.settings.termsAndConditionsText?.trim()) {\n"
              "    issues.push({ key: 'terms', message: 'Add the terms and conditions clients will read before accepting.' });\n"
              "  }\n"
              "  if (!acknowledgement.trim()) {\n"
              "    issues.push({ key: 'acknowledgement', message: 'Add the final acknowledgement customers sign before submitting.' });\n"
              "  }\n"
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected acknowledgement validation once, found {count}')
          editor.write_text(text)

          test = Path('apps/web/src/pages/FormEditorPage.test.tsx')
          text = test.read_text()
          old = "  settings: {\n    showIntroduction: true,\n    showReview: true,\n    completionMessage: 'Thank you.',\n    autosave: true,\n  },"
          new = "  settings: {\n    showIntroduction: true,\n    showReview: true,\n    termsAndConditionsText: '',\n    completionMessage: 'Thank you.',\n    autosave: true,\n  },"
          if text.count(old) != 1:
              raise SystemExit(f'Expected test settings once, found {text.count(old)}')
          test.write_text(text.replace(old, new, 1))
          PY
      - name: Commit the product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/forms.ts \
            apps/web/src/pages/PublicWorkspaceFormPage.tsx \
            apps/web/src/pages/FormEditorPage.tsx \
            apps/web/src/pages/FormEditorPage.test.tsx
          git commit -m "feat: add dedicated form legal content fields [legal-content-applied]"
          git push origin HEAD:${{ github.head_ref }}
