name: Stripe Connect diagnostic
on:
  pull_request:
    paths:
      - 'apps/api/src/modules/integrations/stripe/**'
      - 'apps/web/src/pages/settings/Payments.tsx'
      - 'apps/web/src/pages/settings/StripeReturn.tsx'
      - 'apps/web/src/pages/settings/StripeRefresh.tsx'
      - '.github/workflows/stripe-connect-diagnostic.yml'
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: stripe-connect-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres_ci
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: ks_os_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      DATABASE_URL: postgresql://postgres_ci:postgres_ci_password@127.0.0.1:5432/ks_os_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.13.1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --silent
      - run: pnpm build
      - name: Run API tests and publish concise diagnostics
        shell: bash
        run: |
          set +e
          pnpm --filter api test > /tmp/stripe-connect-tests.log 2>&1
          status=$?

          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- stripe-connect-test-diagnostic -->")) | .id' \
            | while read -r comment_id; do
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}"
              done

          if [ "$status" -ne 0 ]; then
            {
              echo '<!-- stripe-connect-test-diagnostic -->'
              echo '### Stripe Connect API test diagnostic'
              echo '```text'
              grep -E '✖|failing tests:|AssertionError|ERR_ASSERTION|actual:|expected:|operator:|test at ' /tmp/stripe-connect-tests.log | tail -n 300
              echo '```'
            } > /tmp/stripe-connect-comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/stripe-connect-comment.md
          fi
          exit $status
