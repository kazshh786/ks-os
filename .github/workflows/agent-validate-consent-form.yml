name: Validate consent form changes

on:
  pull_request:
    branches:
      - main
    paths:
      - apps/web/src/pages/PublicWorkspaceFormPage.tsx
      - apps/web/src/pages/NotFoundPage.tsx
      - apps/web/src/features/forms/FormRenderer.tsx
      - packages/contracts/src/forms.ts
      - .github/workflows/agent-validate-consent-form.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.13.1 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck contracts
        run: pnpm --filter @ks-os/contracts typecheck
      - name: Typecheck web
        run: pnpm --filter web typecheck
      - name: Typecheck API
        run: pnpm --filter api typecheck
      - name: Build web
        run: pnpm --filter web build
