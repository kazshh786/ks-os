name: Move past-closing toggle

on:
  push:
    branches:
      - agent/move-past-closing-toggle

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/move-past-closing-toggle
          fetch-depth: 0
      - name: Apply UI move
        run: node scripts/move-past-closing-toggle.mjs
      - name: Commit UI move
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move closing-time option to availability"
          git push origin HEAD
