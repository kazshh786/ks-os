# Manually reviewed media infrastructure only. No application deploy script invokes this.
# The example config deliberately contains invalid address/hostname placeholders.
name: ksos-livekit
services:
  livekit:
    image: livekit/livekit-server:v1.13.10
    command: ["--config", "/etc/livekit/livekit.yaml", "--key-file", "/run/secrets/livekit-keys.yaml"]
    network_mode: host
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    cpus: "2.0"
    mem_limit: 2g
    mem_reservation: 512m
    stop_grace_period: 90s
    volumes:
      - type: bind
        source: ${LIVEKIT_CONFIG_FILE:?Set an operator-reviewed absolute config path}
        target: /etc/livekit/livekit.yaml
        read_only: true
      - type: bind
        source: ${LIVEKIT_KEYS_FILE:?Set a private key-map path readable by uid 65532}
        target: /run/secrets/livekit-keys.yaml
        read_only: true
      - type: bind
        source: ${LIVEKIT_TURN_CERT_DIR:?Set the reviewed TURN certificate directory}
        target: /etc/livekit/certs
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      # Alpine's BusyBox wget is present in the pinned upstream image.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
