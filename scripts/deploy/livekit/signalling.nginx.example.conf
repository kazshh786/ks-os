# Review-only example for a dedicated media hostname with a valid managed cert.
# Existing Plesk must own its vhost; translate locations through its supported UI.
# The TLS listener must exclude the separate IP reserved for TURN/TLS.
server {
    listen REPLACE_WITH_SIGNALLING_PUBLIC_IPV4:443 ssl;
    server_name REPLACE_WITH_APPROVED_SIGNALLING_HOSTNAME;
    ssl_certificate REPLACE_WITH_MANAGED_CERTIFICATE_PATH;
    ssl_certificate_key REPLACE_WITH_MANAGED_PRIVATE_KEY_PATH;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Do not record access_token query parameters in proxy logs.
    access_log off;
    client_max_body_size 1m;

    # Public clients use RTC signalling. Administrative Twirp endpoints remain
    # available only to KSOS over the approved private API path.
    location /rtc {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location / { return 404; }
}
